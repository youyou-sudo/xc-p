name: Build and Deploy

# Build the multi-arch image and push it to GHCR, then (optionally) notify a
# deployment target.
#
# The Dockerfile cross-compiles with Bun, so the build stage runs on the native
# runner and emits linux/amd64 + linux/arm64 binaries without QEMU emulation.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Optional download mirror for the Xray release (e.g. https://ghfast.top/).
  # Leave the repository variable unset for GitHub-hosted runners.
  XRAY_DOWNLOAD_MIRROR: ${{ vars.XRAY_DOWNLOAD_MIRROR }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute lowercase image name
        id: image
        env:
          IMAGE_NAME: ${{ github.repository }}
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Both arches come from one amd64 runner: the Dockerfile pins its build
          # stage to $BUILDPLATFORM and cross-compiles per TARGETARCH. Drop
          # linux/arm64 to roughly halve build time if your host is amd64-only.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Must be forwarded explicitly: buildx builds inside a container, so a
          # workflow-level `env:` never reaches the Dockerfile on its own.
          build-args: |
            XRAY_DOWNLOAD_MIRROR=${{ env.XRAY_DOWNLOAD_MIRROR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger redeploy webhook
        # Deployment target is deployment-specific. Set the repository secret
        # DEPLOY_WEBHOOK_URL to a URL that redeploys the app; without it this
        # step warns and exits, and the image is still built and pushed.
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "::warning::Secret DEPLOY_WEBHOOK_URL is not set — skipping Deploy step (image was still built and pushed)."
            exit 0
          fi
          response=$(curl -sS --fail-with-body -X POST \
            "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Deploy response: $response"
