    alterId: 0
    cipher: auto
    udp: true
    tls: true
    servername: us-vm.example.com
    network: ws
    ws-opts:
      path: /vm
      headers:
        Host: us-vm.example.com
  - name: "德国 01 gRPC"
    type: vmess
    server: de-vm.example.com
    port: 8443
    uuid: b831381d-6324-4d53-ad4f-8cda48b30899
    alterId: 64
    cipher: chacha20-poly1305
    tls: true
    servername: de-vm.example.com
