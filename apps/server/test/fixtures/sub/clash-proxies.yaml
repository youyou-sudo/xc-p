    password: "QUFBQUFBQUFBQUFBQUFBQQ=="
    plugin: obfs
    plugin-opts:
      mode: tls
      host: www.bing.com
  - name: "日本 01 obfs"
    type: ss
    server: jp-ss.example.com
    port: 8389
    cipher: aes-128-gcm
    password: "jp-password-01"
