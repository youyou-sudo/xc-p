    network: ws
    ws-opts:
      path: /tj
      headers:
        Host: ca-tj.example.com
  - name: "荷兰 Hysteria2"
    type: hysteria2
    server: nl-hy.example.com
    port: 443
    password: "nl-hy-pass"
    sni: nl-hy.example.com
    skip-cert-verify: true
    alpn: [h3]
    obfs: salamander
    obfs-password: obfspass
  - name: "芬兰 TUIC"
    type: tuic
    server: fi-tuic.example.com
    port: 8443
    uuid: 55555555-5555-5555-5555-555555555555
    password: "fi-tuic-pass"
    sni: fi-tuic.example.com
    alpn: [h3]
    congestion-controller: bbr
    udp-relay-mode: native
  - name: "土耳其 SOCKS5"
    type: socks5
    server: tr-socks.example.com
    port: 1080
    username: sockuser
    password: sockpass
  - name: "巴西 HTTP"
    type: http
    server: br-http.example.com
    port: 8080
    username: httpuser
    password: httppass
  - name: "坏条目-无server"
