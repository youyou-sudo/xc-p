  - name: "澳大利亚 01 WS"
    type: vless
    server: au-vl.example.com
    port: 2053
    uuid: 33333333-3333-3333-3333-333333333333
    tls: true
    servername: au-vl.example.com
    alpn: [h2, http/1.1]
    network: ws
    ws-opts:
      path: /ws
      headers:
        Host: au-vl.example.com
  - name: "加拿大 Trojan"
    type: trojan
    server: ca-tj.example.com
    port: 443
    password: "ca-trojan-pass"
    sni: ca-tj.example.com
